name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Set libclang path (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../pdf-mcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz pdf-mcp
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/pdf-mcp.exe -DestinationPath pdf-mcp-${{ github.ref_name }}-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v6
        with:
          name: pdf-mcp-${{ matrix.target }}
          path: |
            pdf-mcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            pdf-mcp-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pdf-mcp-*.tar.gz
            pdf-mcp-*.zip

  update-formula:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: update-formula
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          URL="https://github.com/maxhodak/pdf-mcp/archive/refs/tags/${VERSION}.tar.gz"
          SHA256=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/pdf-mcp.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/pdf-mcp.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pdf-mcp.rb
          git diff --cached --quiet || git commit -m "Update Homebrew formula for ${GITHUB_REF_NAME}"
          git push
